<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>未命名</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Long+Cang&family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#14141a;
    --ink2:#4a4a53;
    --ink3:#6b6b75;
    --paper:#e9e9ed;
    --edge:rgba(255,255,255,.55);
  }
  /* ★ 禁止长按选择/复制：所有元素都禁止选中、禁止 iOS 长按菜单、禁止拖动 */
  *{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
    -webkit-user-select:none;
    -moz-user-select:none;
    -ms-user-select:none;
    -webkit-touch-callout:none;
    -webkit-user-drag:none;
  }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: radial-gradient(ellipse 140% 110% at 50% 50%,
      #e9e9ed 0%, #d6d6dc 20%, #bcbcc4 36%, #94949e 50%,
      #6c6c76 62%, #4a4a54 72%, #2e2e36 82%, #1a1a20 92%, #121218 100%);
    touch-action: none;
    cursor: pointer;
    font-family: -apple-system, "PingFang SC", "Noto Serif SC", "Microsoft YaHei", serif;
    color: var(--ink);
  }

  #stage {
    position: fixed;
    top: 50%;
    left: 50%;
    width: 480px;
    height: 800px;
    margin-left: -240px;
    margin-top: -400px;
    transform-origin: center center;
    overflow: visible;
  }

  .grain{
    position:fixed;
    inset:0;
    pointer-events:none;
    opacity:.05;
    mix-blend-mode:overlay;
    z-index:100;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  }

  #fx{position:absolute; inset:0; z-index:1; pointer-events:none;}

  .wrap{
    position:absolute;
    left:0; right:0;
    top:252px;
    text-align:center;
    z-index:2;
  }
  .title{
    font-family:"Long Cang","Ma Shan Zheng","STXingkai","Hanzipen SC","KaiTi",cursive;
    font-size:80px;line-height:1.1;font-weight:400;letter-spacing:.02em;
    color:var(--ink);
    text-shadow:0 1px 0 rgba(255,255,255,.35), 0 2px 18px rgba(0,0,0,.10);
  }
  .sub{font-size:10px;letter-spacing:.4em;color:var(--ink3);margin-top:4px;padding-left:.4em;}

  .card{animation:reveal 1.5s cubic-bezier(.2,.7,.2,1) both;padding:0 10px;}
  @keyframes reveal{0%{opacity:0;filter:blur(16px);transform:translateY(12px)}100%{opacity:1;filter:blur(0);transform:none}}

  .card .idx{display:none;}

  .card .lyric{
    font-size:22px;
    font-weight:300;
    line-height:1.48;
    letter-spacing:.04em;
    color:var(--ink);
    min-height:96px;
    display:flex;
    flex-direction:column;
    gap:2px;
    align-items:center;
    justify-content:center;
    margin-top:8px;
  }
  .card .lyric span{display:block;}

  .divider{display:none;}

  .card .meta{font-size:12px;line-height:1.8;color:var(--ink2);margin-top:10px;letter-spacing:.1em;max-width:320px;margin-left:auto;margin-right:auto;}
  .card .credit{font-size:10px;line-height:1.7;color:var(--ink3);margin-top:4px;letter-spacing:.06em;max-width:320px;margin-left:auto;margin-right:auto;opacity:.85;}
  .audio-hint{font-size:11px;color:var(--ink3);margin-top:8px;min-height:16px;letter-spacing:.1em;}
  .equalizer{display:inline-flex;gap:3px;height:14px;align-items:flex-end;margin-left:7px;vertical-align:middle;}
  .equalizer i{width:2px;background:var(--ink);animation:eq .9s ease-in-out infinite;}
  .equalizer i:nth-child(2){animation-delay:.15s}.equalizer i:nth-child(3){animation-delay:.3s}.equalizer i:nth-child(4){animation-delay:.45s}
  @keyframes eq{0%,100%{height:3px}50%{height:14px}}

  .ornament-bottom{
    position:absolute;
    left:0; right:0;
    bottom:54px;
    text-align:center;
    z-index:3;
    pointer-events:none;
    font-family:"Noto Serif SC",serif;
    font-weight:300;
    font-size:24px;
    letter-spacing:.7em;
    padding-left:.7em;
    color:rgba(20,20,30,.40);
    text-shadow:0 1px 0 rgba(255,255,255,.18);
  }
  .ornament-bottom span{
    display:inline-block;
    line-height:1;
    opacity:.85;
    animation:leftBreath 6s ease-in-out infinite;
  }
  .ornament-bottom span:nth-child(1){ animation-delay:0s;    }
  .ornament-bottom span:nth-child(2){ animation-delay:1.5s;  }
  .ornament-bottom span:nth-child(3){ animation-delay:3s;    }
  .ornament-bottom span:nth-child(4){ animation-delay:4.5s;  }
  @keyframes leftBreath{
    0%,100%{ opacity:.55; }
    50%    { opacity:1;   }
  }

  .toast{
    position:fixed;
    top:15%;left:0;right:0;
    text-align:center;
    font-size:13px;
    color:var(--ink);
    letter-spacing:.22em;
    opacity:0;
    transform:translateY(6px);
    transition:opacity .4s,transform .4s;
    z-index:110;
    pointer-events:none;
    text-shadow:0 1px 0 rgba(255,255,255,.4);
  }
  .toast.show{opacity:1;transform:translateY(0);}
</style>
</head>
<body>
  <div class="grain"></div>

  <div id="stage">
    <canvas id="fx"></canvas>
    <div class="wrap">
      <div class="title">未命名</div>
      <div class="sub">UNTITLED</div>
      <div class="card" id="card">
        <div class="idx" id="idx"></div>
        <div class="lyric" id="lyric"></div>
        <div class="meta" id="meta"></div>
        <div class="credit" id="credit"></div>
        <div class="audio-hint" id="audioHint"></div>
      </div>
    </div>

    <div class="ornament-bottom">
      <span>答</span><span>案</span><span>之</span><span>书</span>
    </div>
  </div>

  <div class="toast" id="toast"></div>

<script>
const STAGE_W = 480;
const STAGE_H = 800;
const stage = document.getElementById('stage');

function fitStage(){
  const s = Math.min(innerWidth / STAGE_W, innerHeight / STAGE_H);
  stage.style.transform = `scale(${s})`;
}
fitStage();
addEventListener('resize', fitStage);
addEventListener('orientationchange', fitStage);

/* ★ 全面禁止长按选择/复制 */
document.addEventListener('selectstart', e => e.preventDefault());
document.addEventListener('dragstart',   e => e.preventDefault());
document.addEventListener('touchstart',  e => e.preventDefault(), {passive: false});
document.addEventListener('contextmenu', e => e.preventDefault());

const FALLBACK = [
  {id:1,"song":"Starlight","show":"","credit":"叶麒圣","lyric":"勇敢去追寻 Starlight\n唤醒那与生俱来的力量","audio":"01.mp3"},
  {id:2,"song":"镜中的自己","show":"音乐剧《光影少年》","credit":"叶麒圣","lyric":"适应生存规则\n习惯一个人 尽量过得洒脱","audio":"02.mp3"},
  {id:3,"song":"花间藏刀","show":"音乐剧《锦衣卫之刀与花》","credit":"叶麒圣","lyric":"莫要多问\n只管行路\n别停歇","audio":"03.mp3"},
  {id:4,"song":"纵情享乐","show":"音乐剧《道林格雷的画像》","credit":"叶麒圣","lyric":"满足我内心的欲望\n付出些代价也不必内疚","audio":"04.mp3"},
  {id:5,"song":"影子","show":"音乐剧《锦衣卫之刀与花》","credit":"叶麒圣","lyric":"绝不轻易说出口\n将刀紧握在手","audio":"05.mp3"},
  {id:6,"song":"后会有期","show":"","credit":"叶麒圣","lyric":"不用测量黑白的距离\n善是恶的影","audio":"06.mp3"},
  {id:7,"song":"恨自己太爱你 / 炽热的冲动 (Live版)","show":"爱乐之都第七期","credit":"叶麒圣","lyric":"CHASEN","audio":"07.mp3"},
  {id:8,"song":"My Baby rep","show":"音乐剧《阿波罗尼亚》","credit":"叶麒圣","lyric":"要爱就爱到底\n没什么了不起\n只要我们不分离","audio":"08.mp3"}
];
let DATA = FALLBACK;
let ORDER = [];

async function loadData(){
  try{
    const r = await fetch('answer.json',{cache:'no-store'});
    if(r.ok){
      const j = await r.json();
      if(Array.isArray(j)&&j.length) DATA = j;
    }
  }catch(e){}
}
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = (Math.random()*(i+1))|0;
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
function buildOrder(){ ORDER = shuffle(DATA); }
function nextItem(currentId){
  if(!ORDER.length) return null;
  const idx = ORDER.findIndex(d=>d.id===currentId);
  if(idx < 0) return ORDER[0];
  return ORDER[(idx+1) % ORDER.length];
}
function pickById(id){ return DATA.find(d=>d.id==id) || DATA[0]; }

const player = new Audio();
player.preload = 'auto';
player.loop    = false;
player.volume  = 1;
player.setAttribute('playsinline','');
player.setAttribute('webkit-playsinline','');
player.style.display = 'none';
document.body.appendChild(player);

let current = null;
let audioReady = false;
let pendingItem = null;

const audioHint = document.getElementById('audioHint');
const toastEl = document.getElementById('toast');

function setPlaying(on, msg){
  audioHint.innerHTML = on
    ? '<span class="equalizer"><i></i><i></i><i></i><i></i></span>'
    : (msg || '');
}

player.addEventListener('waiting', ()=>{
  if(audioReady) setPlaying(false, '缓冲中…');
});
player.addEventListener('stalled', ()=>{
  if(audioReady) setPlaying(false, '网络不稳…');
});
player.addEventListener('playing', ()=>{
  audioReady = true;
  pendingItem = null;
  setPlaying(true);
});
player.addEventListener('pause', ()=>{ if(!player.ended) setPlaying(false); });
player.addEventListener('ended', ()=>{ setPlaying(false); });
player.addEventListener('error',   ()=>{
  setPlaying(false, '音频加载失败');
  console.warn('[audio] 失败:', player.src, player.error && player.error.code);
});

function playItem(item){
  if(!item) return;
  current = item;
  if(!item.audio){ setPlaying(false, '（这首还没放音频）'); return; }

  try{ player.pause(); }catch(e){}
  try{ player.currentTime = 0; }catch(e){}

  const src = new URL(item.audio, location.href).href;
  if(player.src !== src){
    player.src = src;
    try{ player.load(); }catch(e){}
  }

  setPlaying(false, '加载中…');

  const doPlay = ()=>{
    const p = player.play();
    if(p && p.then){
      p.then(()=>{
        audioReady = true; pendingItem = null;
        setPlaying(true);
      }).catch(err=>{
        audioReady = false; pendingItem = item;
        setPlaying(false, '轻触屏幕播放');
        console.warn('[audio] 播放被拦/失败：', err && err.name, err && err.message);
      });
    }else{
      audioReady = true; pendingItem = null; setPlaying(true);
    }
  };

  if(player.readyState >= 3){
    doPlay();
  }else{
    let done = false;
    const onReady = ()=>{ if(done) return; done = true; doPlay(); };
    player.addEventListener('canplaythrough', onReady, {once:true});
    setTimeout(()=>{ if(done) return; done = true; doPlay(); }, 4000);
  }
}

function unlockAndPlay(item){
  const it = item || pendingItem || current;
  if(!it) return;
  playItem(it);
}
function replay(){ if(current) playItem(current); }

function reveal(item){
  const card = document.getElementById('card');
  card.style.animation='none'; void card.offsetWidth; card.style.animation='';

  document.getElementById('idx').textContent = '';
  document.getElementById('lyric').innerHTML =
    String(item.lyric || '').split('\n').map(s=>`<span>${s}</span>`).join('');
  document.getElementById('meta').textContent = item.song || '';
  document.getElementById('credit').textContent = [item.show, item.credit].filter(Boolean).join(' · ');
  playItem(item);
}

/* =========================================================================
   Canvas：只保留蓄光墨晕 + 中圈 + 进度环
   ★ 粒子效果已全部删除
   ========================================================================= */
const cv = document.getElementById('fx');
const ctx = cv.getContext('2d');
const DPR = Math.min(window.devicePixelRatio||1, 2);
const W = STAGE_W * DPR;
const H = STAGE_H * DPR;
cv.width  = W;
cv.height = H;
cv.style.width  = STAGE_W + 'px';
cv.style.height = STAGE_H + 'px';

const cx = W/2;
const cy = H/2;
const fieldR = 165 * DPR;

let charge = 0, charging = false, lastT = performance.now(), downT = 0;
const HOLD = 1.1, THRESH = 0.55;

function loop(now){
  const dt = Math.min(0.05, (now - lastT)/1000); lastT = now;
  const t = now/1000;

  if(charging) charge = Math.min(1, charge + dt/HOLD);
  else         charge = Math.max(0, charge - dt/0.5);
  if(charging && charge >= 1) nextAnswer();

  ctx.clearRect(0,0,W,H);
  ctx.globalCompositeOperation = 'source-over';

  /* 蓄光墨晕（长按时中心扩散的深色） */
  if(charge>0.01){
    const g = ctx.createRadialGradient(cx,cy,0, cx,cy, fieldR*(0.5+charge*0.5));
    g.addColorStop(0, `rgba(25,25,35,${0.12*charge})`);
    g.addColorStop(1, 'rgba(25,25,35,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(cx,cy,fieldR*(0.5+charge*0.5),0,6.2832);
    ctx.fill();
  }

  /* 中圈边界（淡圈，常显） */
  ctx.lineWidth = 1.2*DPR;
  ctx.strokeStyle = 'rgba(0,0,0,0.07)';
  ctx.beginPath();
  ctx.arc(cx,cy,fieldR,0,6.2832);
  ctx.stroke();

  /* 长按蓄光进度环 */
  if(charge>0.01){
    ctx.strokeStyle = `rgba(20,20,30,${0.35+charge*0.5})`;
    ctx.beginPath();
    ctx.arc(cx,cy,fieldR, -Math.PI/2, -Math.PI/2 + charge*6.2832);
    ctx.stroke();
  }

  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

let toastTimer = null;
function showToast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>toastEl.classList.remove('show'), 1600);
}

function nextAnswer(){
  if(charging||charge>0){ charging=false; charge=0; }
  reveal(nextItem(current ? current.id : null));
}
function press(e){
  e.preventDefault();
  unlockAndPlay();
  charging = true; downT = performance.now();
}
function release(){
  if(!charging) return;
  charging = false;
  const held = performance.now() - downT;
  if(charge >= THRESH){
    nextAnswer();
  }else if(held < 260){
    replay();
  }
}
addEventListener('pointerdown', press, {passive:false});
addEventListener('pointerup', release);
addEventListener('pointercancel', release);

loadData().then(()=>{
  buildOrder();
  const pid = new URLSearchParams(location.search).get('id');
  if(pid){
    reveal(pickById(pid));
  }else{
    reveal(ORDER[0]);
  }
});

document.addEventListener('visibilitychange', ()=>{
  if(!document.hidden && !audioReady && pendingItem) unlockAndPlay();
});
</script>
</body>
</html>
