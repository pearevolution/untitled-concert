<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>未命名</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Long+Cang&family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#14141a;
    --ink2:#4a4a53;
    --ink3:#6b6b75;
    --paper:#e9e9ed;
    --edge:rgba(255,255,255,.55);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    font-family:-apple-system,"PingFang SC","Noto Serif SC","Microsoft YaHei",serif;
    background:radial-gradient(ellipse 130% 100% at 50% 44%,
      #e9e9ed 0%, #dadade 18%, #c2c2c9 32%, #9a9aa3 46%,
      #61616a 60%, #2a2a31 74%, #101014 86%, #000 100%);
    color:var(--ink);min-height:100%;overflow:hidden;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:28px 22px;position:relative;touch-action:none;user-select:none;-webkit-user-select:none;
  }
  .grain{position:fixed;inset:0;pointer-events:none;opacity:.05;mix-blend-mode:overlay;z-index:0;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");}

  #fx{position:fixed;inset:0;z-index:1;pointer-events:none;}

  .wrap{position:relative;z-index:2;width:100%;max-width:520px;text-align:center;}
  .title{
    font-family:"Long Cang","Ma Shan Zheng","STXingkai","Hanzipen SC","KaiTi",cursive;
    font-size:92px;line-height:1.1;font-weight:400;letter-spacing:.02em;color:var(--ink);
    text-shadow:0 1px 0 rgba(255,255,255,.35), 0 2px 18px rgba(0,0,0,.10);
  }
  .sub{font-size:10px;letter-spacing:.4em;color:var(--ink3);margin-top:4px;padding-left:.4em;}

  .card{animation:reveal 1.5s cubic-bezier(.2,.7,.2,1) both;z-index:2;padding:0 10px;}
  @keyframes reveal{0%{opacity:0;filter:blur(16px);transform:translateY(12px)}100%{opacity:1;filter:blur(0);transform:none}}

  .card .idx{
    font-size:10px;
    letter-spacing:.4em;
    color:var(--ink3);
    margin-bottom:22px;
    padding-left:.4em;
    min-height:16px;
  }

  .card .lyric{font-size:22px;font-weight:300;line-height:1.95;letter-spacing:.04em;color:var(--ink);min-height:96px;display:flex;flex-direction:column;gap:2px;align-items:center;justify-content:center;}
  .card .lyric span{display:block;}
  .divider{width:46px;height:1px;background:rgba(0,0,0,.16);margin:24px auto 0;}
  .card .meta{font-size:12px;line-height:1.8;color:var(--ink2);margin-top:18px;letter-spacing:.1em;max-width:320px;margin-left:auto;margin-right:auto;}
  .card .credit{font-size:10px;line-height:1.7;color:var(--ink3);margin-top:8px;letter-spacing:.06em;max-width:320px;margin-left:auto;margin-right:auto;opacity:.85;}
  .audio-hint{font-size:11px;color:var(--ink3);margin-top:14px;min-height:16px;letter-spacing:.1em;}
  .equalizer{display:inline-flex;gap:3px;height:14px;align-items:flex-end;margin-left:7px;vertical-align:middle;}
  .equalizer i{width:2px;background:var(--ink);animation:eq .9s ease-in-out infinite;}
  .equalizer i:nth-child(2){animation-delay:.15s}.equalizer i:nth-child(3){animation-delay:.3s}.equalizer i:nth-child(4){animation-delay:.45s}
  @keyframes eq{0%,100%{height:3px}50%{height:14px}}

  .left-ornament{
    position:fixed;
    left:26px;
    top:50%;
    transform:translateY(-50%);
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:14px;
    z-index:3;
    pointer-events:none;
    font-family:"Noto Serif SC",serif;
    font-weight:300;
    font-size:11px;
    letter-spacing:0;
    color:rgba(20,20,30,.42);
    text-shadow:0 1px 0 rgba(255,255,255,.18);
  }
  .left-ornament span{
    display:block;
    line-height:1;
    opacity:.85;
    animation:leftBreath 6s ease-in-out infinite;
  }
  .left-ornament span:nth-child(1){ animation-delay:0s;    }
  .left-ornament span:nth-child(2){ animation-delay:1.5s;  }
  .left-ornament span:nth-child(3){ animation-delay:3s;    }
  .left-ornament span:nth-child(4){ animation-delay:4.5s;  }
  @keyframes leftBreath{
    0%,100%{ opacity:.55; }
    50%    { opacity:1;   }
  }
  .left-ornament::before{
    content:'';
    width:1px;height:22px;
    background:rgba(20,20,30,.22);
    margin-bottom:4px;
  }
  .left-ornament::after{
    content:'';
    width:1px;height:22px;
    background:rgba(20,20,30,.22);
    margin-top:4px;
  }

  .hint .tap{display:inline-block;margin-right:7px;animation:tapPulse 1.5s ease-in-out infinite;}
  @keyframes tapPulse{0%,100%{opacity:.35;transform:translateX(0)}50%{opacity:1;transform:translateX(3px)}}
  .hint{position:fixed;bottom:54px;left:0;right:0;text-align:center;font-size:11px;color:var(--edge);letter-spacing:.14em;z-index:3;}
  .foot{position:fixed;bottom:18px;left:0;right:0;text-align:center;font-size:10px;color:rgba(255,255,255,.4);letter-spacing:.12em;line-height:1.9;z-index:3;}
  .foot code{color:rgba(255,255,255,.75);background:rgba(255,255,255,.08);padding:1px 6px;border-radius:3px;font-size:10px;}
</style>
</head>
<body>
  <div class="grain"></div>
  <canvas id="fx"></canvas>

  <div class="left-ornament">
    <span>答</span>
    <span>案</span>
    <span>之</span>
    <span>书</span>
  </div>

  <div class="wrap">
    <div class="title">未命名</div>
    <div class="sub">UNTITLED</div>
    <div class="card" id="card">
      <div class="idx" id="idx"></div>
      <div class="lyric" id="lyric"></div>
      <div class="divider"></div>
      <div class="meta" id="meta"></div>
      <div class="credit" id="credit"></div>
      <div class="audio-hint" id="audioHint"></div>
    </div>
  </div>

  <div class="hint" id="hint"><span class="tap">▶</span> 轻触屏幕 · 播放声音</div>
  <div class="foot">
    靠近 NFC 标签自动开启 · 固定答案用 <code>?id=3</code>
  </div>

<script>
/* =========================================================================
   内容清单：8 首
   audio 字段 = 同目录下的文件名（HTML 与 mp4 必须放在同一个文件夹）
   如果你改过名，实际文件叫 01.mp4.mp4，就把 "01.mp4" 改成 "01.mp4.mp4"，以此类推
   ========================================================================= */
const FALLBACK = [
  {id:1,"song":"Starlight","show":"","credit":"叶麒圣","lyric":"勇敢去追寻 Starlight\n唤醒那与生俱来的力量","audio":"01.mp4"},
  {id:2,"song":"镜中的自己","show":"音乐剧《光影少年》","credit":"叶麒圣","lyric":"适应生存规则\n习惯一个人 尽量过得洒脱","audio":"02.mp4"},
  {id:3,"song":"花间藏刀","show":"音乐剧《锦衣卫之刀与花》","credit":"叶麒圣","lyric":"莫要多问\n只管行路\n别停歇","audio":"03.mp4"},
  {id:4,"song":"纵情享乐","show":"音乐剧《道林格雷的画像》","credit":"叶麒圣","lyric":"满足我内心的欲望\n付出些代价也不必内疚","audio":"04.mp4"},
  {id:5,"song":"影子","show":"音乐剧《锦衣卫之刀与花》","credit":"叶麒圣","lyric":"绝不轻易说出口\n将刀紧握在手","audio":"05.mp4"},
  {id:6,"song":"后会有期","show":"","credit":"叶麒圣","lyric":"不用测量黑白的距离\n善是恶的影","audio":"06.mp4"},
  {id:7,"song":"恨自己太爱你 / 炽热的冲动 (Live版)","show":"爱乐之都第七期","credit":"叶麒圣","lyric":"CHASEN","audio":"07.mp4"},
  {id:8,"song":"My Baby rep","show":"音乐剧《阿波罗尼亚》","credit":"叶麒圣","lyric":"要爱就爱到底\n没什么了不起\n只要我们不分离","audio":"08.mp4"}
];
let DATA = FALLBACK;
let ORDER = [];        // 随机播放顺序（每次打开重新洗牌）

async function loadData(){
  try{
    const r = await fetch('answer.json',{cache:'no-store'});
    if(r.ok){
      const j = await r.json();
      if(Array.isArray(j)&&j.length) DATA = j;
    }
  }catch(e){}
}

/* Fisher–Yates 洗牌 */
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = (Math.random()*(i+1))|0;
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
function buildOrder(){ ORDER = shuffle(DATA); }

/* 按随机顺序取下一首 */
function nextItem(currentId){
  if(!ORDER.length) return null;
  const idx = ORDER.findIndex(d=>d.id===currentId);
  if(idx < 0) return ORDER[0];
  return ORDER[(idx+1) % ORDER.length];
}
/* 按 id 定点取（NFC ?id=3 用） */
function pickById(id){ return DATA.find(d=>d.id==id) || DATA[0]; }

/* =========================================================================
   音频播放
   ========================================================================= */
const player = new Audio();
player.preload = 'auto';
player.loop    = false;
player.volume  = 1;
player.setAttribute('playsinline','');
player.setAttribute('webkit-playsinline','');
player.style.display = 'none';
document.body.appendChild(player);

let current = null;
let audioReady = false;
let pendingItem = null;

const audioHint = document.getElementById('audioHint');
function setPlaying(on, msg){
  audioHint.innerHTML = on
    ? '<span class="equalizer"><i></i><i></i><i></i><i></i></span>'
    : (msg || '');
}

function playItem(item){
  if(!item) return;
  current = item;
  if(!item.audio){ setPlaying(false, '（这首还没放音频）'); return; }

  try{ player.pause(); }catch(e){}
  try{ player.currentTime = 0; }catch(e){}

  const src = new URL(item.audio, location.href).href;
  if(player.src !== src) player.src = src;

  const p = player.play();
  if(p && p.then){
    p.then(()=>{
      audioReady = true; pendingItem = null;
      setPlaying(true);
      hintEl.innerHTML = '<span class="tap">▶</span> 长按蓄光 · 下一首　·　轻点重听';
    }).catch(err=>{
      audioReady = false; pendingItem = item;
      setPlaying(false, '▶ 轻触屏幕 · 播放声音');
      hintEl.innerHTML = '<span class="tap">▶</span> 轻触屏幕 · 播放声音';
      console.warn('[audio] 播放被拦/失败：', err && err.name, err && err.message);
    });
  }else{
    audioReady = true; pendingItem = null; setPlaying(true);
  }
}

function unlockAndPlay(item){
  const it = item || pendingItem || current;
  if(!it) return;
  playItem(it);
}
function replay(){ if(current) playItem(current); }

player.addEventListener('playing', ()=>{ audioReady = true; pendingItem = null; setPlaying(true); });
player.addEventListener('pause',   ()=>{ if(!player.ended) setPlaying(false); });
player.addEventListener('ended',   ()=>{ setPlaying(false); });
player.addEventListener('error',   ()=>{
  setPlaying(false, '音频加载失败');
  console.warn('[audio] 失败:', player.src, player.error && player.error.code);
});

/* =========================================================================
   揭晓
   ========================================================================= */
function reveal(item){
  const card = document.getElementById('card');
  card.style.animation='none'; void card.offsetWidth; card.style.animation='';
  document.getElementById('idx').textContent  = 'NO.' + String(item.id).padStart(2,'0');
  document.getElementById('lyric').innerHTML =
    String(item.lyric || '').split('\n').map(s=>`<span>${s}</span>`).join('');
  document.getElementById('meta').textContent = item.song || '';
  document.getElementById('credit').textContent = [item.show, item.credit].filter(Boolean).join(' · ');
  playItem(item);
}

/* =========================================================================
   Canvas 中圈珠光粒子
   ========================================================================= */
const cv = document.getElementById('fx');
const ctx = cv.getContext('2d');
let W,H,DPR,cx,cy,fieldR,maxR;
function resize(){
  DPR = Math.min(window.devicePixelRatio||1, 2);
  W = cv.width = Math.floor(innerWidth*DPR);
  H = cv.height = Math.floor(innerHeight*DPR);
  cv.style.width = innerWidth+'px'; cv.style.height = innerHeight+'px';
  cx = W/2; cy = H/2;
  fieldR = Math.min(W,H) * 0.2475;
  maxR   = fieldR * 0.90;
  initParticles();
}
const N = 100; let ps = [];
const HUES = [200, 220, 265, 320, 350, 45];
function initParticles(){
  ps = [];
  for(let i=0;i<N;i++){
    const a = Math.random()*Math.PI*2, r = Math.sqrt(Math.random())*maxR;
    ps.push({ x:cx+Math.cos(a)*r, y:cy+Math.sin(a)*r, vx:0, vy:0,
              seed:Math.random()*1000, hue:HUES[(Math.random()*HUES.length)|0] });
  }
}
resize(); addEventListener('resize', resize);

function field(x,y,t){
  return ( Math.sin(x*0.0006 + t*0.07)
         + Math.cos(y*0.0006 - t*0.06)
         + Math.sin((x+y)*0.0005 + t*0.05) ) * Math.PI;
}

let charge = 0, charging = false, lastT = performance.now(), downT = 0;
const HOLD = 1.1, THRESH = 0.55;

function loop(now){
  const dt = Math.min(0.05, (now - lastT)/1000); lastT = now;
  const t = now/1000;
  if(charging) charge = Math.min(1, charge + dt/HOLD);
  else         charge = Math.max(0, charge - dt/0.5);
  if(charging && charge >= 1) nextAnswer();

  ctx.clearRect(0,0,W,H);
  ctx.globalCompositeOperation = 'source-over';
  const pull = 0.006 + charge*0.04;
  for(const p of ps){
    const ang = field(p.x, p.y, t + p.seed*0.01);
    let fx = Math.cos(ang), fy = Math.sin(ang);
    const dx = cx - p.x, dy = cy - p.y, d = Math.hypot(dx,dy)+0.001;
    fx += dx/d*pull; fy += dy/d*pull;
    if(d > maxR){
      const k = (d - maxR) * 0.03;
      fx -= dx/d*k; fy -= dy/d*k;
      p.vx *= 0.85; p.vy *= 0.85;
    }
    p.vx = (p.vx + fx*0.30) * 0.88;
    p.vy = (p.vy + fy*0.30) * 0.88;
    p.x += p.vx; p.y += p.vy;

    const sp = Math.hypot(p.vx,p.vy);
    const rad = (1.3 + sp*0.5 + charge*1.3)*DPR;
    const h = p.hue + Math.sin(t*0.5 + p.seed)*8;
    const a = (0.16 + sp*0.06) * (0.55 + charge*0.8);
    const g = ctx.createRadialGradient(p.x,p.y,0, p.x,p.y,rad);
    g.addColorStop(0,   `hsla(${h},20%,40%,${a})`);
    g.addColorStop(0.45,`hsla(${h},18%,55%,${a*0.55})`);
    g.addColorStop(1,   `hsla(${h},16%,68%,0)`);
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(p.x,p.y,rad,0,6.2832); ctx.fill();
    ctx.fillStyle = `rgba(255,255,255,${a*0.75})`;
    ctx.beginPath(); ctx.arc(p.x-rad*0.30, p.y-rad*0.30, rad*0.28, 0, 6.2832); ctx.fill();
  }
  if(charge>0.01){
    const g = ctx.createRadialGradient(cx,cy,0, cx,cy, fieldR*(0.5+charge*0.5));
    g.addColorStop(0, `rgba(25,25,35,${0.12*charge})`);
    g.addColorStop(1, 'rgba(25,25,35,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx,cy,fieldR*(0.5+charge*0.5),0,6.2832); ctx.fill();
  }
  ctx.lineWidth = 1.2*DPR; ctx.strokeStyle = 'rgba(0,0,0,0.07)';
  ctx.beginPath(); ctx.arc(cx,cy,fieldR,0,6.2832); ctx.stroke();
  if(charge>0.01){
    ctx.strokeStyle = `rgba(20,20,30,${0.35+charge*0.5})`;
    ctx.beginPath(); ctx.arc(cx,cy,fieldR, -Math.PI/2, -Math.PI/2 + charge*6.2832); ctx.stroke();
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* =========================================================================
   交互：长按蓄力 → 下一首；轻点 → 重听
   ========================================================================= */
const hintEl = document.getElementById('hint');
function nextAnswer(){
  if(charging||charge>0){ charging=false; charge=0; }
  reveal(nextItem(current ? current.id : null));
}

function press(e){
  e.preventDefault();
  unlockAndPlay();
  charging = true; downT = performance.now();
  hintEl.style.opacity = '.4';
}
function release(){
  if(!charging) return;
  charging = false;
  const held = performance.now() - downT;
  hintEl.style.opacity = '';
  if(charge >= THRESH){
    nextAnswer();
  }else if(held < 260){
    replay();
  }else{
    hintEl.textContent = '再长按一次，蓄满光';
    setTimeout(()=>{ hintEl.innerHTML='<span class="tap">▶</span> 长按蓄光 · 下一首　·　轻点重听'; },1400);
  }
}
addEventListener('pointerdown', press, {passive:false});
addEventListener('pointerup', release);
addEventListener('pointercancel', release);
addEventListener('contextmenu', e=>e.preventDefault());

/* =========================================================================
   初始化：加载数据 → 洗牌 → 出第一首（随机）
   ========================================================================= */
loadData().then(()=>{
  buildOrder();                                    // ← 每次打开重新洗牌
  const pid = new URLSearchParams(location.search).get('id');
  if(pid){
    reveal(pickById(pid));                         // NFC 固定 ?id=N 时按 id 出
  }else{
    reveal(ORDER[0]);                              // 否则随机出第一首
  }
});
hintEl.innerHTML = '<span class="tap">▶</span> 轻触屏幕 · 播放声音';

document.addEventListener('visibilitychange', ()=>{
  if(!document.hidden && !audioReady && pendingItem) unlockAndPlay();
});
</script>
</body>
</html>
